<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0550FF" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data/assets/docslogo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <link rel="stylesheet" href="data/css/base.css" />
  <link rel="stylesheet" href="data/css/editor.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Editor • Buddy Docs</title>
</head>
<body>
  <header class="editor-header">
    <div class="menubar">
      <div class="left">
        <a href="./" class="logo-link" title="Home">
          <img class="logo" src="data/assets/docslogo.svg" alt="Buddy Docs"/>
        </a>
        <div class="title-stack">
          <h1 id="docTitle" contenteditable="true" spellcheck="false">Untitled</h1>
          <nav class="menu-row" aria-label="Application menu">
            <button id="fileMenuBtn" class="menu-btn" data-menu="file" aria-haspopup="true" aria-expanded="false">File</button>
            <button class="menu-btn" data-menu="edit">Edit</button>
            <button class="menu-btn" data-menu="view">View</button>
            <button class="menu-btn" data-menu="insert">Insert</button>
            <button class="menu-btn" data-menu="format">Format</button>
            <button class="menu-btn" data-menu="tools">Tools</button>
            <button class="menu-btn" data-menu="help">Help</button>
          </nav>
        </div>
      </div>
      <div class="right">
        <button id="syncIndicator" class="icon-btn" title="Saved" disabled>
          <span id="syncIcon" class="material-symbols-outlined">check</span>
        </button>
        <button id="profileBtn" class="avatar" title="Profile">U</button>
        <div id="profileMenu" class="menu" hidden>
          <a href="settings.html" class="menu-item"><span class="material-symbols-outlined">settings</span> Settings</a>
          <a href="calendar.html" class="menu-item"><span class="material-symbols-outlined">calendar_month</span> Calendar</a>
          <button class="menu-item" data-action="theme-toggle"><span class="material-symbols-outlined">dark_mode</span> Toggle Theme</button>
        </div>
      </div>
    </div>
    
    <!-- File dropdown (replaces old meta sidebar) -->
    <div id="fileDropdown" class="dropdown-menu wide" hidden>
      <a class="menu-item" href="./"><span class="material-symbols-outlined">home</span> Home</a>
      <a class="menu-item" href="editor.html?type=document"><span class="material-symbols-outlined">add</span> New</a>
      <div class="menu-divider"></div>
      <button id="openDocSettings" class="menu-item"><span class="material-symbols-outlined">tune</span> Document settings</button>
      <div class="menu-divider"></div>
      <button id="archiveBtn" class="menu-item"><span class="material-symbols-outlined">inventory_2</span> Archive</button>
      <button id="deleteBtn" class="menu-item delete"><span class="material-symbols-outlined">delete</span> Delete</button>
      <div class="menu-divider"></div>
      <button id="exportBdoxBtn" class="menu-item"><span class="material-symbols-outlined">download</span> Export (.bdox)</button>
      <button id="exportAsBtn" class="menu-item"><span class="material-symbols-outlined">ios_share</span> Export as</button>
    </div>
    <!-- Export As submenu -->
    <div id="exportAsMenu" class="dropdown-menu" hidden>
      <button class="menu-item" data-export="txt">Plain text (.txt)</button>
      <button class="menu-item" data-export="md">Markdown (.md)</button>
      <button class="menu-item" data-export="pdf">PDF (.pdf)</button>
      <button class="menu-item" data-export="docx">Word (.docx)</button>
      <button class="menu-item" data-export="bdox">Buddy Docs (.bdox)</button>
      <div class="menu-divider"></div>
      <button class="menu-item" data-export="gdocs"><span class="material-symbols-outlined">content_copy</span> Copy to Google Docs</button>
    </div>
    <div class="formatbar">
        <button data-cmd="undo" class="icon-btn" title="Undo"><span class="material-symbols-outlined">undo</span></button>
        <button data-cmd="redo" class="icon-btn" title="Redo"><span class="material-symbols-outlined">redo</span></button>
        <span class="sep"></span>
        <select id="blockFormat" class="input" title="Block style">
          <option value="p">Paragraph</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="blockquote">Quote</option>
          <option value="pre">Code</option>
        </select>
        <span class="sep"></span>
        <button data-cmd="bold" class="icon-btn" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
        <button data-cmd="italic" class="icon-btn" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
        <button data-cmd="underline" class="icon-btn" title="Underline"><span class="material-symbols-outlined">format_underlined</span></button>
        <button data-cmd="strikeThrough" class="icon-btn" title="Strikethrough"><span class="material-symbols-outlined">strikethrough_s</span></button>
        <span class="sep"></span>
        <button data-cmd="justifyLeft" class="icon-btn" title="Align left"><span class="material-symbols-outlined">format_align_left</span></button>
        <button data-cmd="justifyCenter" class="icon-btn" title="Align center"><span class="material-symbols-outlined">format_align_center</span></button>
        <button data-cmd="justifyRight" class="icon-btn" title="Align right"><span class="material-symbols-outlined">format_align_right</span></button>
        <span class="sep"></span>
        <button data-cmd="insertUnorderedList" class="icon-btn" title="Bulleted list"><span class="material-symbols-outlined">format_list_bulleted</span></button>
        <button data-cmd="insertOrderedList" class="icon-btn" title="Numbered list"><span class="material-symbols-outlined">format_list_numbered</span></button>
        <span class="sep"></span>
        <button id="insertLink" class="icon-btn" title="Insert link"><span class="material-symbols-outlined">link</span></button>
        <button id="insertImage" class="icon-btn" title="Insert image"><span class="material-symbols-outlined">image</span></button>
        <input id="imageInput" type="file" accept="image/*" hidden />
        <span class="sep"></span>
        <button id="clearFormat" class="icon-btn" title="Clear formatting"><span class="material-symbols-outlined">format_clear</span></button>
    </div>
  </header>

  <main class="editor-wrap no-meta">

    <section class="page">
      <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>
    </section>
  </main>

  <!-- Document Settings Modal -->
  <div id="docSettingsModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Document settings</h3>
        <button class="icon-btn" id="closeDocSettings" title="Close"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <label>
          <span>Type</span>
          <select id="docType">
            <option value="document">Document</option>
            <option value="essay">Essay</option>
            <option value="list">List</option>
            <option value="gallery">Gallery</option>
          </select>
        </label>
        <label>
          <span>Due date</span>
          <input id="dueDate" type="date"/>
        </label>
        <label>
          <span>Tags</span>
          <input id="tags" type="text" placeholder="comma, separated"/>
        </label>
      </div>
    </div>
  </div>

  <script src="data/js/idb.js" type="module"></script>
  <script src="data/js/theme.js" type="module"></script>
  <script src="data/js/editor.js" type="module"></script>
  <script type="module">
    import { setSetting, getSetting } from './data/js/idb.js';
    // avatar handling
    (async () => {
      const profilePicture = await getSetting('profilePicture', null);
      const initials = await getSetting('initials', 'BD');
      const btn = document.getElementById('profileBtn');
      
      if (btn) {
        if (profilePicture) {
          btn.style.backgroundImage = `url(${profilePicture})`;
          btn.textContent = '';
        } else {
          btn.style.backgroundImage = '';
          btn.textContent = (initials || 'BD').slice(0,2).toUpperCase();
        }
      }
    })();

    const btn = document.getElementById('profileBtn');
    const menu = document.getElementById('profileMenu');
    function closeMenu(){
      if (menu?.classList.contains('open')){
        menu.classList.remove('open');
        document.removeEventListener('click', onDocClick);
        window.removeEventListener('resize', closeMenu);
        window.removeEventListener('scroll', closeMenu, true);
      }
    }
    function onDocClick(e){ if (!menu.contains(e.target) && e.target !== btn) closeMenu(); }
    btn?.addEventListener('click', (e)=>{
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      if (isOpen){
        document.addEventListener('click', onDocClick);
        window.addEventListener('resize', closeMenu);
        window.addEventListener('scroll', closeMenu, true);
      } else closeMenu();
    });
    menu?.addEventListener('click', async (e)=>{
      const target = e.target.closest('.menu-item');
      if (!target) return;
      if (target.dataset.action === 'theme-toggle'){
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        const next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        await setSetting('theme', next);
        closeMenu();
      }
    });
  </script>
</body>
</html>
