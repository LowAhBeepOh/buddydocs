<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0550FF" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data/assets/docslogo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bitcount+Single:slnt,wght,CRSV,ELSH,ELXP@-8..0,100..900,0..1,0..100,0..100&family=Boldonse&family=Bytesized&family=Cal+Sans&family=Cherry+Bomb+One&family=Chokokutai&family=Comic+Relief:wght@400;700&family=Coral+Pixels&family=Creepster&family=DM+Serif+Text:ital@0;1&family=DotGothic16&family=Doto:wght,ROND@100..900,0..100&family=Exile&family=Flow+Circular&family=Freeman&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jacquarda+Bastarda+9&family=Jersey+15&family=Kalnia:wdth,wght@100..125,100..700&family=Mochiy+Pop+One&family=Nabla:EDPT,EHLT@0..200,0..24&family=Noto+Color+Emoji&family=Pangolin&family=Playfair:ital,opsz,wdth,wght@0,5..1200,87.5..112.5,300..900;1,5..1200,87.5..112.5,300..900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&family=Rubik+Scribble&family=Sixtyfour&family=Tiny5&family=Workbench:SCAN@-53..100&family=Young+Serif&family=Cossette+Titre:wght@400;700&display=swap');
  </style>

  <link rel="stylesheet" href="data/css/base.css" />
  <link rel="stylesheet" href="data/css/editor.css" />
  <link rel="stylesheet" href="data/css/music-player.css" />
  <link rel="stylesheet" href="data/css/more-editor.css" />
  <link rel="stylesheet" href="data/css/ai-enhanced.css" />
  <link rel="stylesheet" href="data/css/new-features.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Editor • Buddy Docs</title>
</head>
<body>
  <header class="editor-header">
    <div class="menubar">
      <div class="left">
        <a href="./" class="logo-link" title="Home">
          <img class="logo" src="data/assets/docslogo.svg" alt="Buddy Docs"/>
        </a>
        <div class="title-stack">
          <h1 id="docTitle" contenteditable="true" spellcheck="false">Untitled</h1>
          <nav class="menu-row" aria-label="Application menu">
            <button id="fileMenuBtn" class="menu-btn" data-menu="file" aria-haspopup="true" aria-expanded="false">File</button>
            <button class="menu-btn" data-menu="edit">Edit</button>
            <button class="menu-btn" data-menu="view">View</button>
            <button class="menu-btn" data-menu="insert">Insert</button>
            <button class="menu-btn" data-menu="format">Format</button>
            <button id="toolsMenuBtn" class="menu-btn" data-menu="tools" aria-haspopup="true" aria-expanded="false">Tools</button>
            <button class="menu-btn" data-menu="help">Help</button>
          </nav>
        </div>
      </div>
      <div class="right">
        <!-- Mode Switcher -->
        <div id="modeSwitcher" class="mode-switcher">
          <button id="editModeBtn" class="mode-btn active" title="Editing">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button id="viewModeBtn" class="mode-btn" title="View">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
        <button id="syncIndicator" class="icon-btn" title="Saved" disabled>
          <span id="syncIcon" class="material-symbols-outlined">check</span>
        </button>
        <button id="profileBtn" class="avatar" title="Profile">U</button>
        <div id="profileMenu" class="menu" hidden>
          <a href="settings.html" class="menu-item"><span class="material-symbols-outlined">settings</span> Settings</a>
          <a href="calendar.html" class="menu-item"><span class="material-symbols-outlined">calendar_month</span> Calendar</a>
          <button class="menu-item" data-action="theme-toggle"><span class="material-symbols-outlined">dark_mode</span> Toggle Theme</button>
        </div>
      </div>
    </div>
    
    <!-- File dropdown (replaces old meta sidebar) -->
    <div id="fileDropdown" class="dropdown-menu wide" hidden>
      <a class="menu-item" href="./"><span class="material-symbols-outlined">home</span> Home</a>
      <a class="menu-item" href="editor.html?type=document"><span class="material-symbols-outlined">add</span> New</a>
      <div class="menu-divider"></div>
      <button id="openDocSettings" class="menu-item"><span class="material-symbols-outlined">tune</span> Document settings</button>
      <div class="menu-divider"></div>
      <button id="archiveBtn" class="menu-item"><span class="material-symbols-outlined">inventory_2</span> Archive</button>
      <button id="deleteBtn" class="menu-item delete"><span class="material-symbols-outlined">delete</span> Delete</button>
      <div class="menu-divider"></div>
      <button id="exportBdoxBtn" class="menu-item"><span class="material-symbols-outlined">download</span> Export (.bdox)</button>
      <button id="exportAsBtn" class="menu-item"><span class="material-symbols-outlined">ios_share</span> Export as</button>
    </div>
    <!-- Tools dropdown -->
    <div id="toolsDropdown" class="dropdown-menu" hidden>
      <button id="openAiBtn" class="tools-menu-item ai-item">
        <span class="material-symbols-outlined">auto_awesome</span>
        <span>CompactB</span>
      </button>
      <div class="menu-divider"></div>
      <button id="openShortcuts" class="tools-menu-item">
        <span class="material-symbols-outlined">keyboard</span>
        <span>Keyboard Shortcuts</span>
      </button>
      <button id="openWordCount" class="tools-menu-item">
        <span class="material-symbols-outlined">analytics</span>
        <span>Word Count</span>
      </button>
      <div class="menu-divider"></div>
      <button id="openVersionHistory" class="tools-menu-item">
        <span class="material-symbols-outlined">history</span>
        <span>Version History</span>
      </button>
      <button id="openSummaryTool" class="tools-menu-item">
        <span class="material-symbols-outlined">summarize</span>
        <span>Summary</span>
      </button>
      <button id="openReview" class="tools-menu-item">
        <span class="material-symbols-outlined">spellcheck</span>
        <span>Review</span>
      </button>
      <div class="menu-divider"></div>
      <button id="toggleSmartCompose" class="tools-menu-item">
        <span class="material-symbols-outlined">auto_fix_high</span>
        <span>Smart Compose</span>
      </button>
    </div>
    <!-- Export As submenu -->
    <div id="exportAsMenu" class="dropdown-menu" hidden>
      <button class="menu-item" data-export="txt">Plain text (.txt)</button>
      <button class="menu-item" data-export="md">Markdown (.md)</button>
      <button class="menu-item" data-export="pdf">PDF (.pdf)</button>
      <button class="menu-item" data-export="docx">Word (.docx)</button>
      <button class="menu-item" data-export="bdox">Buddy Docs (.bdox)</button>
      <div class="menu-divider"></div>
      <button class="menu-item" data-export="gdocs"><span class="material-symbols-outlined">content_copy</span> Copy to Google Docs</button>
    </div>
    <div class="formatbar">
        <button data-cmd="undo" class="icon-btn" title="Undo"><span class="material-symbols-outlined">undo</span></button>
        <button data-cmd="redo" class="icon-btn" title="Redo"><span class="material-symbols-outlined">redo</span></button>
        <span class="sep"></span>
        <select id="blockFormat" class="input" title="Block style">
          <option value="p">Paragraph</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="h4">Heading 4</option>
          <option value="h5">Heading 5</option>
          <option value="h6">Heading 6</option>
          <option value="blockquote">Quote</option>
          <option value="pre">Code</option>
        </select>
        <span class="sep"></span>
        <div class="font-controls">
          <select id="fontName" class="input" title="Font family">
            <option style="font-family: Arial, sans-serif;" value="Arial">Arial</option>
            <option style="font-family: 'Times New Roman', serif;" value="Times New Roman">Times New Roman</option>
            <option style="font-family: 'Courier New', monospace;" value="Courier New">Courier New</option>
            <option style="font-family: 'Georgia', serif;" value="Georgia">Georgia</option>
            <option style="font-family: 'Verdana', sans-serif;" value="Verdana">Verdana</option>
            <option style="font-family: 'Bitcount Single', sans-serif;" value="Bitcount Single">Bitcount Single</option>
            <option style="font-family: 'Boldonse', sans-serif;" value="Boldonse">Boldonse</option>
            <option style="font-family: 'Bytesized', sans-serif;" value="Bytesized">Bytesized</option>
            <option style="font-family: 'Cal Sans', sans-serif;" value="Cal Sans">Cal Sans</option>
            <option style="font-family: 'Cherry Bomb One', cursive;" value="Cherry Bomb One">Cherry Bomb One</option>
            <option style="font-family: 'Chokokutai', sans-serif;" value="Chokokutai">Chokokutai</option>
            <option style="font-family: 'Comic Relief', cursive;" value="Comic Relief">Comic Relief</option>
            <option style="font-family: 'Coral Pixels', sans-serif;" value="Coral Pixels">Coral Pixels</option>
            <option style="font-family: 'Cossette Titre', sans-serif;" value="Cossette Titre">Cossette Titre</option>
            <option style="font-family: 'Creepster', cursive;" value="Creepster">Creepster</option>
            <option style="font-family: 'DM Serif Text', serif;" value="DM Serif Text">DM Serif Text</option>
            <option style="font-family: 'DotGothic16', sans-serif;" value="DotGothic16">DotGothic16</option>
            <option style="font-family: 'Doto', sans-serif;" value="Doto">Doto</option>
            <option style="font-family: 'Exile', sans-serif;" value="Exile">Exile</option>
            <option style="font-family: 'Flow Circular', sans-serif;" value="Flow Circular">Flow Circular</option>
            <option style="font-family: 'Freeman', sans-serif;" value="Freeman">Freeman</option>
            <option style="font-family: 'Host Grotesk', sans-serif;" value="Host Grotesk">Host Grotesk</option>
            <option style="font-family: 'Instrument Sans', sans-serif;" value="Instrument Sans">Instrument Sans</option>
            <option style="font-family: 'Inter Tight', sans-serif;" value="Inter Tight">Inter Tight</option>
            <option style="font-family: 'Inter', sans-serif;" value="Inter">Inter</option>
            <option style="font-family: 'Jacquarda Bastarda 9', cursive;" value="Jacquarda Bastarda 9">Jacquarda Bastarda 9</option>
            <option style="font-family: 'Jersey 15', sans-serif;" value="Jersey 15">Jersey 15</option>
            <option style="font-family: 'Kalnia', serif;" value="Kalnia">Kalnia</option>
            <option style="font-family: 'Mochiy Pop One', sans-serif;" value="Mochiy Pop One">Mochiy Pop One</option>
            <option style="font-family: 'Nabla', cursive;" value="Nabla">Nabla</option>
            <option style="font-family: 'Pangolin', cursive;" value="Pangolin">Pangolin</option>
            <option style="font-family: 'Playfair', serif;" value="Playfair">Playfair</option>
            <option style="font-family: 'Roboto', sans-serif;" value="Roboto">Roboto</option>
            <option style="font-family: 'Rubik Scribble', cursive;" value="Rubik Scribble">Rubik Scribble</option>
            <option style="font-family: 'Sixtyfour', sans-serif;" value="Sixtyfour">Sixtyfour</option>
            <option style="font-family: 'Tiny5', sans-serif;" value="Tiny5">Tiny5</option>
            <option style="font-family: 'Workbench', sans-serif;" value="Workbench">Workbench</option>
            <option style="font-family: 'Young Serif', serif;" value="Young Serif">Young Serif</option>
          </select>
        </div>
        <span class="sep"></span>
        <button data-cmd="bold" class="icon-btn" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
        <button data-cmd="italic" class="icon-btn" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
        <button data-cmd="underline" class="icon-btn" title="Underline"><span class="material-symbols-outlined">format_underlined</span></button>
        <button data-cmd="strikeThrough" class="icon-btn" title="Strikethrough"><span class="material-symbols-outlined">strikethrough_s</span></button>
        <span class="sep"></span>
        <button data-cmd="justifyLeft" class="icon-btn" title="Align left"><span class="material-symbols-outlined">format_align_left</span></button>
        <button data-cmd="justifyCenter" class="icon-btn" title="Align center"><span class="material-symbols-outlined">format_align_center</span></button>
        <button data-cmd="justifyRight" class="icon-btn" title="Align right"><span class="material-symbols-outlined">format_align_right</span></button>
        <span class="sep"></span>
        <button data-cmd="insertUnorderedList" class="icon-btn" title="Bulleted list"><span class="material-symbols-outlined">format_list_bulleted</span></button>
        <button data-cmd="insertOrderedList" class="icon-btn" title="Numbered list"><span class="material-symbols-outlined">format_list_numbered</span></button>
        <span class="sep"></span>
        <button id="insertLink" class="icon-btn" title="Insert link"><span class="material-symbols-outlined">link</span></button>
        <button id="insertImage" class="icon-btn" title="Insert image"><span class="material-symbols-outlined">image</span></button>
        <input id="imageInput" type="file" accept="image/*" hidden />
        <span class="sep"></span>
        <button id="clearFormat" class="icon-btn" title="Clear formatting"><span class="material-symbols-outlined">format_clear</span></button>
    </div>
  </header>

  <main class="editor-wrap with-outline">
    <!-- Document Outline Sidebar -->
    <aside id="outlineSidebar" class="outline-sidebar">
      <div class="outline-header">
        <div class="outline-title">
          <span>Outline</span>
        </div>
        <div class="outline-tabs">
          <button id="outlineTabBtn" class="outline-tab active" data-tab="outline">Outline</button>
          <button id="pagesTabBtn" class="outline-tab" data-tab="pages">Pages</button>
        </div>
      </div>
      <div class="outline-content">
        <div id="outlineList" class="outline-list">
          <div class="outline-empty">
            Headings you add to the document will appear here.
          </div>
        </div>
        <div id="pagesList" class="pages-list" hidden>
          <button id="addPageBtn" class="add-page-btn">
            <span class="material-symbols-outlined">add</span>
            <span>Add Page</span>
          </button>
          <div id="pagesContainer" class="pages-container"></div>
        </div>
      </div>
    </aside>

    <section class="page">
      <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>
    </section>

    <!-- Review Sidebar (right) -->
    <aside id="reviewSidebar" class="outline-sidebar" hidden>
      <div class="outline-header">
        <div class="outline-title">
          <span>Review</span>
        </div>
      </div>
      <div class="outline-content">
        <div id="reviewStats"></div>
        <div id="reviewList" class="outline-list"></div>
      </div>
    </aside>

    <div class="spacer"></div>
  </main>

  <!-- Status Bar -->
  <footer class="status-bar">
    <div class="word-progress-bar" id="wordProgressBar" style="width:0%"></div>
    <div class="status-left">
      <button id="wordCountWidget" class="word-count-widget" title="Document statistics">
        <span id="wordCountDisplay">0 words</span>
      </button>
      <span style="margin-left: 8px; color:var(--muted); font-size:12px;">Goal:</span>
      <input id="wordGoalInput" type="number" min="0" step="50" class="word-goal-input" value="0" title="Set word goal"/>
    </div>
    <div id="musicPlayerWidget" class="music-player" style="display: none;">
      <div class="song-info">
        <span id="songTitle"></span> - <span id="songArtist"></span>
      </div>
      <div class="controls">
        <button id="prevBtn" class="icon-btn"><span class="material-symbols-outlined">skip_previous</span></button>
        <button id="playPauseBtn" class="icon-btn"><span class="material-symbols-outlined">play_arrow</span></button>
        <button id="nextBtn" class="icon-btn"><span class="material-symbols-outlined">skip_next</span></button>
        <button id="loopBtn" class="icon-btn"><span class="material-symbols-outlined">repeat</span></button>
        <button id="shuffleBtn" class="icon-btn"><span class="material-symbols-outlined">shuffle</span></button>
      </div>
    </div>
    <div class="status-right">
      <button id="hideMenusBtn" class="icon-btn" title="Hide menus (Ctrl+Shift+F)">
        <span class="material-symbols-outlined">fullscreen</span>
      </button>
    </div>
  </footer>

  <!-- Document Settings Modal -->
  <div id="docSettingsModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Document settings</h3>
        <button class="icon-btn" id="closeDocSettings" title="Close"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <label>
          <span>Type</span>
          <select id="docType">
            <option value="document">Document</option>
            <option value="essay">Essay</option>
            <option value="list">List</option>
            <option value="gallery">Gallery</option>
          </select>
        </label>
        <label>
          <span>Due date</span>
          <input id="dueDate" type="date"/>
        </label>
        <label>
          <span>Tags</span>
          <input id="tags" type="text" placeholder="comma, separated"/>
        </label>
      </div>
    </div>
  </div>

  <script src="data/js/idb.js" type="module"></script>
  <script src="data/js/theme.js" type="module"></script>
  <script src="data/js/version-history.js" type="module"></script>
  <script src="data/js/summary-tool.js" type="module"></script>
  <script src="data/js/grammar-check.js" type="module"></script>
  <script src="data/js/editor.js" type="module"></script>
  <script src="data/js/music-player.js" type="module"></script>
  <script src="data/js/ai.js" type="module"></script>
  <script type="module">
    import { setSetting, getSetting } from './data/js/idb.js';
    // avatar handling
    (async () => {
      const profilePicture = await getSetting('profilePicture', null);
      const initials = await getSetting('initials', 'BD');
      const btn = document.getElementById('profileBtn');
      
      if (btn) {
        if (profilePicture) {
          btn.style.backgroundImage = `url(${profilePicture})`;
          btn.textContent = '';
        } else {
          btn.style.backgroundImage = '';
          btn.textContent = (initials || 'BD').slice(0,2).toUpperCase();
        }
      }
    })();

    const btn = document.getElementById('profileBtn');
    const menu = document.getElementById('profileMenu');
    function closeMenu(){
      if (menu?.classList.contains('open')){
        menu.classList.remove('open');
        document.removeEventListener('click', onDocClick);
        window.removeEventListener('resize', closeMenu);
        window.removeEventListener('scroll', closeMenu, true);
      }
    }
    function onDocClick(e){ if (!menu.contains(e.target) && e.target !== btn) closeMenu(); }
    btn?.addEventListener('click', (e)=>{
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      if (isOpen){
        document.addEventListener('click', onDocClick);
        window.addEventListener('resize', closeMenu);
        window.addEventListener('scroll', closeMenu, true);
      } else closeMenu();
    });
    menu?.addEventListener('click', async (e)=>{
      const target = e.target.closest('.menu-item');
      if (!target) return;
      if (target.dataset.action === 'theme-toggle'){
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        const next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        await setSetting('theme', next);
        closeMenu();
      }
    });
  </script>
</body>
</html>
